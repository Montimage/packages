name: CI

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download actionlint
        run: |
          set -euo pipefail
          curl -sLO "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz"
          curl -sLO "https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_checksums.txt"
          EXPECTED="8aca8db96f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          ACTUAL=$(sha256sum actionlint_1.7.12_linux_amd64.tar.gz | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "actionlint SHA256 mismatch: expected $EXPECTED, got $ACTUAL" >&2
            exit 1
          fi
          tar xzf actionlint_1.7.12_linux_amd64.tar.gz
          chmod +x actionlint

      - name: Download shellcheck
        run: |
          set -euo pipefail
          curl -sLO "https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz"
          EXPECTED="8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198"
          ACTUAL=$(sha256sum shellcheck-v0.11.0.linux.x86_64.tar.xz | awk '{print $1}')
          if [ "$ACTUAL" != "$EXPECTED" ]; then
            echo "shellcheck SHA256 mismatch: expected $EXPECTED, got $ACTUAL" >&2
            exit 1
          fi
          tar xJf shellcheck-v0.11.0.linux.x86_64.tar.xz
          cp shellcheck-v0.11.0/shellcheck .

      - name: Run actionlint
        run: ./actionlint .github/workflows/

      - name: Run shellcheck
        run: ./shellcheck --exclude=2148 --exclude=2215 --exclude=2216 .github/workflows/*.yml
